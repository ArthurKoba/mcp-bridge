name: MVP Backend

on:
  pull_request:
    paths:
      - "services/**"
      - "scripts/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mvp-backend.yaml"
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Explicitly build the three Docker images'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --dev --no-install-project
      - run: .venv/bin/ruff check services scripts/release_candidate.py
      - run: .venv/bin/mypy services/authorization services/bridge services/common services/admin-api/src scripts/release_candidate.py

  images:
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true
    runs-on: zoomies-mcp-bridge-builder
    strategy:
      fail-fast: false
      matrix:
        target: [authorization, gateway, admin-api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target "${{ matrix.target }}" -t "mcp-bridge:${{ matrix.target }}" .
