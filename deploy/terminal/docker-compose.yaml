# Portable Compose. One service / one Coolify Application; staged, not deployed.
# No dependency on legacy MCP resources, volumes, databases or networks.
services:
  briareus-terminal:
    build:
      context: ../..
      dockerfile: deploy/terminal/Dockerfile
    restart: "no"
    # No legacy provider/server startup until C1-B2/C2 is accepted.
    command: ["/bin/sh", "-ec", "echo DEV_RUNTIME_TRANSPORT_PENDING >&2; exit 78"]
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-terminal"]
    volumes:
      - data:/workspace
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
volumes:
  data:
    name: briareus-terminal-v1
networks:
  briareus:
    external: true
    name: briareus-net
