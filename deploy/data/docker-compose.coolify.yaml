x-watch-path-coolify:
  - "deploy/data/Dockerfile"
  - "deploy/data/Dockerfile.dockerignore"
  - "deploy/data/owner-bootstrap.psql"
  - "deploy/data/postgres-entrypoint.sh"
  - "deploy/data/docker-compose.yaml"
  - "deploy/data/docker-compose.coolify.yaml"

# Per-Application Coolify adapter: vendor services deploy together as one data release.
services:
  briareus-postgres:
    extends:
      file: docker-compose.yaml
      service: briareus-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-briareus_dev}"
      IDENTITY_POSTGRES_USER: "{{project.IDENTITY_POSTGRES_USER}}"
      IDENTITY_POSTGRES_PASSWORD: "{{project.IDENTITY_POSTGRES_PASSWORD}}"
      ACCESS_POSTGRES_USER: "{{project.ACCESS_POSTGRES_USER}}"
      ACCESS_POSTGRES_PASSWORD: "{{project.ACCESS_POSTGRES_PASSWORD}}"
      CONTROL_POSTGRES_USER: "{{project.CONTROL_POSTGRES_USER}}"
      CONTROL_POSTGRES_PASSWORD: "{{project.CONTROL_POSTGRES_PASSWORD}}"
      CATALOG_POSTGRES_USER: "{{project.CATALOG_POSTGRES_USER}}"
      CATALOG_POSTGRES_PASSWORD: "{{project.CATALOG_POSTGRES_PASSWORD}}"
      POSTGRES_USER: "${POSTGRES_USER:-briareus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
  briareus-valkey:
    extends:
      file: docker-compose.yaml
      service: briareus-valkey
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
# Physical volume names intentionally preserve the existing live storage IDs;
# runtime/container/DNS naming is environment-neutral. Rename storage only via explicit data migration.
volumes:
  postgres-data:
    name: briareus-dev-postgres-v1
  valkey-data:
    name: briareus-dev-valkey-v1
networks:
  briareus:
    external: true
    name: briareus-net
