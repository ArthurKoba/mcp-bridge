x-watch-path-coolify:
  - "deploy/data/Dockerfile"
  - "deploy/data/Dockerfile.dockerignore"
  - "deploy/data/owner-bootstrap.psql"
  - "deploy/data/postgres-entrypoint.sh"
  - "deploy/data/docker-compose.yaml"
  - "deploy/data/docker-compose.coolify.yaml"

# Briareus third-party data dependencies: ONE Coolify Application, TWO
# vendor containers. No application module lives in this release unit.
# This release unit is independent of Admin/Gateway/Authorization/MCP domains.
services:
  briareus-postgres:
    build:
      context: ../..
      dockerfile: deploy/data/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-briareus_dev}"
      IDENTITY_POSTGRES_USER: "${IDENTITY_POSTGRES_USER:-}"
      IDENTITY_POSTGRES_PASSWORD: "${IDENTITY_POSTGRES_PASSWORD:-}"
      ACCESS_POSTGRES_USER: "${ACCESS_POSTGRES_USER:-}"
      ACCESS_POSTGRES_PASSWORD: "${ACCESS_POSTGRES_PASSWORD:-}"
      CONTROL_POSTGRES_USER: "${CONTROL_POSTGRES_USER:-}"
      CONTROL_POSTGRES_PASSWORD: "${CONTROL_POSTGRES_PASSWORD:-}"
      CATALOG_POSTGRES_USER: "${CATALOG_POSTGRES_USER:-}"
      CATALOG_POSTGRES_PASSWORD: "${CATALOG_POSTGRES_PASSWORD:-}"
      POSTGRES_USER: "${POSTGRES_USER:-briareus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
    expose:
      - "5432"
    networks:
      briareus:
        aliases: ["briareus-postgres"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/briareus-owner-databases-ready && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
  briareus-valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
      TZ: "${TZ:-UTC}"
    expose:
      - "6379"
    networks:
      briareus:
        aliases: ["briareus-valkey"]
    volumes:
      - valkey-data:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        case "$$VALKEY_PASSWORD" in
          ""|*[!0-9a-f]*) echo "invalid Valkey credential format" >&2; exit 78 ;;
        esac
        [ "$$(printf %s "$$VALKEY_PASSWORD" | wc -c)" -eq 64 ] || exit 78
        printf 'save ""\nappendonly yes\nrequirepass %s\nmaxmemory 128mb\nmaxmemory-policy allkeys-lru\n' "$$VALKEY_PASSWORD" > /tmp/valkey.conf
        exec valkey-server /tmp/valkey.conf
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
# Physical volume names intentionally preserve the existing live storage IDs;
# runtime/container/DNS naming is environment-neutral. Rename storage only via explicit data migration.
volumes:
  postgres-data:
    name: briareus-dev-postgres-v1
  valkey-data:
    name: briareus-dev-valkey-v1
networks:
  briareus:
    external: true
    name: briareus-net
