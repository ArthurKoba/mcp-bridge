x-watch-path-coolify:
  - "deploy/authorization/Dockerfile"
  - "deploy/authorization/Dockerfile.dockerignore"
  - "deploy/authorization/docker-compose.yaml"
  - "deploy/authorization/docker-compose.coolify.yaml"
  - "deploy/authorization/wheel-pin.json"
  - "deploy/install_wheel_release.py"

# Coolify parses literals and Required ENV before resolving Shared references.
services:
  briareus-authorization:
    extends:
      file: docker-compose.yaml
      service: briareus-authorization
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      SERVICE_NAMESPACE: "${SERVICE_NAMESPACE:-briareus}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      OTEL_SERVICE_NAME: "authorization"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_access"
      POSTGRES_USER: "${ACCESS_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${ACCESS_POSTGRES_PASSWORD:?}"
      MIGRATION_POSTGRES_USER: "${ACCESS_MIGRATION_POSTGRES_USER:?}"
      MIGRATION_POSTGRES_PASSWORD: "${ACCESS_MIGRATION_POSTGRES_PASSWORD:?}"
networks:
  briareus:
    external: true
    name: briareus-net
