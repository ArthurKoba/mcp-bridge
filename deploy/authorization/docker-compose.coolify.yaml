x-watch-path-coolify:
  - "deploy/authorization/Dockerfile"
  - "deploy/authorization/Dockerfile.dockerignore"
  - "deploy/authorization/docker-compose.yaml"
  - "deploy/authorization/docker-compose.coolify.yaml"
  - "pyproject.toml"
  - "uv.lock"
  - "README.md"
  - "LICENSE"
  - ".python-version"
  - "services/**"
  - "scripts/**"

# Coolify parses literals and Required ENV before resolving Shared references.
services:
  briareus-authorization:
    extends:
      file: docker-compose.yaml
      service: briareus-authorization
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
      POSTGRES_HOST: "briareus-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "briareus_access"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      MIGRATION_POSTGRES_USER: "${MIGRATION_POSTGRES_USER:?}"
      MIGRATION_POSTGRES_PASSWORD: "${MIGRATION_POSTGRES_PASSWORD:?}"
networks:
  briareus:
    external: true
    name: briareus-net
