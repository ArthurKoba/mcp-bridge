# One Briareus SVC module, with GitHub and GitLab adapters in one image.
# C1-B2/C2: signed service caller and unified runtime not yet implemented.
services:
  briareus-svc:
    build:
      context: ../..
      dockerfile: deploy/svc/Dockerfile
    restart: "no"
    stop_grace_period: 30s
    command: ["/bin/sh", "-ec", "echo BRIAREUS_SVC_AUTH_PENDING >&2; exit 78"]
    environment:
      TZ: "${TZ:-UTC}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-}"
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-}"
      OTEL_SERVICE_NAMESPACE: "${OTEL_SERVICE_NAMESPACE:?}"
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: "${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:?}"
    expose:
      - "8000"
    networks:
      briareus:
        aliases: ["briareus-svc"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
networks:
  briareus:
    external: true
    name: briareus-net
