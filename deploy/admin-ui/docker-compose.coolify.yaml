x-watch-path-coolify:
  - "deploy/admin-ui/Dockerfile"
  - "deploy/admin-ui/Dockerfile.dockerignore"
  - "deploy/admin-ui/docker-compose.yaml"
  - "deploy/admin-ui/docker-compose.coolify.yaml"
  - "admin-web-app/package.json"
  - "admin-web-app/bun.lock"
  - "admin-web-app/components.json"
  - "admin-web-app/index.html"
  - "admin-web-app/tsconfig.json"
  - "admin-web-app/vite.config.ts"
  - "admin-web-app/src/**"
  - "admin-web-app/public/**"
  - "admin-web-app/nginx.conf.template"

# Coolify override for a single independent Git-backed Application.
# Coolify variable discovery happens before resolving extends; mirror env keys.
# Secret values, when consumed, come only from protected Coolify Project Shared Variables. No secret in Git.
# Public static UI FQDN is provisioned; authenticated API is separate.
services:
  briareus-admin-ui:
    extends:
      file: docker-compose.yaml
      service: briareus-admin-ui
    environment:
      TZ: "${TZ:-UTC}"
      SERVICE_URL_BRIAREUS_ADMIN_UI_8080: "/"
      PUBLIC_UI_URL: "${SERVICE_URL_BRIAREUS_ADMIN_UI_8080}"
networks:
  briareus:
    external: true
    name: briareus-net
